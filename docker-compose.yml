services:
  mysql:
    image: mysql:8.0
    container_name: tareas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tareas
      MYSQL_USER: tareas_user
      MYSQL_PASSWORD: tareas_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tareas_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tareas-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - tareas_net

volumes:
  mysql_data:

networks:
  tareas_net: